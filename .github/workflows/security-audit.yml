name: Scheduled security audit

on:
  schedule:
    # Weekly, near Renovate's Monday run (UTC).
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security_audit:
    runs-on: ubicloud-standard-2

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun audit
        id: js_audit
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p tmp/security-audit
          bun audit 2>&1 | tee tmp/security-audit/bun-audit.txt

      - name: Retain audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit-results
          path: tmp/security-audit/
          if-no-files-found: ignore

      - name: Fail when a scheduled audit finds an issue
        if: always()
        run: |
          if [[ "${{ steps.js_audit.outcome }}" == "failure" ]]; then
            echo "A scheduled security audit failed; review the retained audit results."
            exit 1
          fi
